
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Завдання 4</title>
</head>
<body>

<h2>Завдання 4 — TodoList</h2>

<input id="taskInput" placeholder="Нове завдання">
<button id="addBtn">Додати</button>
<ul id="taskList"></ul>

<script>
// Клас одного завдання
class Task {
    constructor(id, text) {
        this.id = id;
        this.text = text;
        this.done = false;
    }

    // Зміна стану завдання
    toggle() {
        this.done = !this.done;
    }
}

// Клас списку завдань
class TodoList {
    constructor() {
        this.tasks = [];
        this.nextId = 1;
    }

    // Додавання нового завдання
    add(text) {
        const task = new Task(this.nextId, text);
        this.tasks.push(task);
        this.nextId++;
        return task;
    }

    // Видалення завдання за id
    remove(id) {
        this.tasks = this.tasks.filter(task => task.id !== id);
    }

    // Отримання незавершених завдань
    getActive() {
        return this.tasks.filter(task => task.done === false);
    }
}

// Створення списку
const todoList = new TodoList();

const taskInput = document.getElementById("taskInput");
const addBtn = document.getElementById("addBtn");
const taskList = document.getElementById("taskList");

// Відображення списку на сторінці
function renderTasks() {
    taskList.innerHTML = "";

    for (const task of todoList.tasks) {
        const li = document.createElement("li");

        li.textContent = task.text;
        li.dataset.id = task.id;

        if (task.done) {
            li.style.textDecoration = "line-through";
        }

        taskList.appendChild(li);
    }

    console.log("Активні завдання:", todoList.getActive());
}

// Додавання завдання кнопкою
addBtn.addEventListener("click", function () {
    const text = taskInput.value.trim();

    if (text === "") {
        alert("Введіть текст завдання");
        return;
    }

    todoList.add(text);
    taskInput.value = "";
    renderTasks();
});

// Делегування подій для перемикання стану завдання
taskList.addEventListener("click", function (event) {
    if (event.target.tagName === "LI") {
        const id = Number(event.target.dataset.id);

        const task = todoList.tasks.find(task => task.id === id);

        if (task) {
            task.toggle();
            renderTasks();
        }
    }
});
</script>

</body>
</html>
